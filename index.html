<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom Bike Shop</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f0f2f5; --ink:#1b2430; --ink-2:#5b6675;
    --line:#e2e6ec; --accent:#e8590c; --accent-ink:#ffffff; --good:#1a7f4b; --warn:#b7791f;
    --bad:#c0392b; --chip:#eef1f5; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
    --radius:12px;
  }
  :root[data-theme="dark"]{
    --bg:#0f1319; --panel:#161b23; --panel-2:#1c222c; --ink:#e6eaf0; --ink-2:#9aa6b6;
    --line:#28303b; --accent:#f97316; --accent-ink:#1b1206; --good:#3fbf7f; --warn:#e0a83e;
    --bad:#f06b5c; --chip:#222a35; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1319; --panel:#161b23; --panel-2:#1c222c; --ink:#e6eaf0; --ink-2:#9aa6b6;
      --line:#28303b; --accent:#f97316; --accent-ink:#1b1206; --good:#3fbf7f; --warn:#e0a83e;
      --bad:#f06b5c; --chip:#222a35; --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .side{width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;gap:4px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:800;font-size:17px;letter-spacing:.2px}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--ink-2);font-weight:600}
  .nav a .ic{width:18px;text-align:center;opacity:.9}
  .nav a:hover{background:var(--panel-2);color:var(--ink)}
  .nav a.active{background:var(--accent);color:var(--accent-ink)}
  .side .spacer{flex:1}
  .side .foot{font-size:12px;color:var(--ink-2);padding:8px}
  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:none}
  .content{padding:26px 30px;max-width:1180px;width:100%;margin:0 auto}
  h1{font-size:23px;margin:0 0 3px}
  h2{font-size:16px;margin:26px 0 12px;letter-spacing:.2px}
  .sub{color:var(--ink-2);margin:0 0 20px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  /* Cards + stat tiles */
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .tile .k{font-size:12.5px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .tile .v{font-size:26px;font-weight:800;margin-top:6px}
  .tile .v small{font-size:13px;font-weight:600;color:var(--ink-2)}
  .tile.click{cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .tile.click:hover{border-color:var(--accent)}
  .tile.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .tile .car{float:right;opacity:.4;font-weight:400}
  .tile.active .car{opacity:.9;transform:rotate(180deg);display:inline-block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .hd{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .bd{padding:16px}
  .card .bd.tight{padding:0}
  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:650;cursor:pointer;font-size:14px}
  .btn:hover{background:var(--panel-2)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.pri:hover{filter:brightness(.96)}
  .btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
  .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);font-weight:700}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr:last-child td{border-bottom:none}
  .muted{color:var(--ink-2)}
  .empty{padding:40px;text-align:center;color:var(--ink-2)}
  /* Chips */
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:650;color:var(--ink-2)}
  .chip.stage{color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .chip.good{color:var(--good)} .chip.good .dot{background:var(--good)}
  .chip.warn{color:var(--warn)} .chip.warn .dot{background:var(--warn)}
  .chip.bad{color:var(--bad)} .chip.bad .dot{background:var(--bad)}
  /* Forms */
  .form{display:grid;gap:15px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.wide{grid-column:1/-1}
  label{font-weight:650;font-size:13px;color:var(--ink-2)}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px}
  .hint{font-size:12px;color:var(--ink-2)}
  fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0}
  legend{font-weight:750;padding:0 8px;color:var(--ink)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  /* Kanban */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px}
  .lane{flex:0 0 250px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:72vh}
  .lane .lh{padding:11px 13px;font-weight:750;font-size:13px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
  .lane .lb{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  .oc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer}
  .oc:hover{border-color:var(--accent)}
  .oc .t{font-weight:700}
  .oc .m{font-size:12.5px;color:var(--ink-2);margin-top:3px}
  .oc .blk{margin-top:7px;font-size:12px;color:var(--warn);display:flex;gap:5px;align-items:center}
  /* Detail layout */
  .cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px}
  .kv dt{color:var(--ink-2);font-weight:600}
  .kv dd{margin:0}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .gallery figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2)}
  .gallery img{width:100%;height:100px;object-fit:cover;display:block}
  .gallery figcaption{font-size:11px;padding:5px 7px;color:var(--ink-2);display:flex;justify-content:space-between;gap:4px;align-items:center}
  .filechip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:8px}
  .timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  .timeline li{display:flex;gap:11px}
  .timeline .tdot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;flex:0 0 auto}
  .timeline .tx{flex:1}
  .timeline .tt{font-size:12px;color:var(--ink-2)}
  .checkitem{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
  .checkitem input{width:auto}
  .checkitem.done label{text-decoration:line-through;color:var(--ink-2)}
  .backlink{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-weight:600;margin-bottom:14px}
  .backlink:hover{color:var(--ink)}
  .pillbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .rowline{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .rowline input,.rowline select{flex:1}
  .note{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:9px}
  .note .nt{font-size:12px;color:var(--ink-2);margin-bottom:3px}
  .shopinfo{padding:0 8px 12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .shopinfo .shopname{font-weight:750;font-size:13.5px;line-height:1.3}
  .shopinfo .shopsub{font-size:12px;color:var(--ink-2)}
  .shopinfo a.shopsub:hover{text-decoration:underline}
  .invoice{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:34px;max-width:840px;box-shadow:var(--shadow)}
  .invoice .ihead{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .invoice .ititle{font-size:25px;font-weight:800;margin:6px 0 2px;letter-spacing:.5px}
  .invoice .parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  .invoice .party .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);font-weight:700;margin-bottom:5px}
  .itotals{margin-left:auto;width:290px;max-width:100%;margin-top:10px}
  .itotals .r{display:flex;justify-content:space-between;padding:6px 0}
  .itotals .r.grand{border-top:2px solid var(--line);margin-top:4px;padding-top:11px;font-weight:800;font-size:17px}
  .itotals .r.due{border-top:1px solid var(--line);margin-top:4px;padding-top:11px;color:var(--accent);font-size:16px}
  .logo{max-height:70px;max-width:220px;object-fit:contain;display:block;margin-bottom:8px}
  .statusdoc{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:34px;max-width:820px;box-shadow:var(--shadow)}
  .sd-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}
  .sd-shop{font-weight:800;font-size:18px}
  .sd-title{font-size:22px;font-weight:800;letter-spacing:.5px}
  .sd-meta{text-align:right}
  .sd-for{color:var(--ink-2);margin-bottom:6px}
  .sd-spec{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 22px}
  .sd-progress{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:22px}
  .sd-current{font-size:16px;margin-bottom:10px}
  .sd-bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
  .sd-fill{height:100%;background:var(--accent);border-radius:999px}
  .sd-msg{margin-top:12px}
  .sd-eta{margin-top:8px;color:var(--ink-2)}
  .sd-stages{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
  .sd-stages li{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--ink-2)}
  .sd-stages li .mk{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;border:2px solid var(--line)}
  .sd-stages li.done{color:var(--ink)}
  .sd-stages li.done .mk{background:var(--good);border-color:var(--good);color:#fff}
  .sd-stages li.cur{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:750;color:var(--ink)}
  .sd-stages li.cur .mk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .sd-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:22px 0 0}
  .sd-photos img{width:100%;height:130px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .sd-foot{border-top:1px solid var(--line);padding-top:14px;margin-top:22px;color:var(--ink-2);font-size:13px}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin:16px 0}
  .hbars{display:flex;flex-direction:column;gap:8px}
  .hbar{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:10px;font-size:13px}
  .hbar-l{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar-track{background:var(--panel-2);border-radius:999px;height:12px;overflow:hidden}
  .hbar-fill{height:100%;background:var(--accent);border-radius:999px}
  .hbar-v{text-align:right;font-weight:700;min-width:34px;white-space:nowrap}
  .donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .donut-legend{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
  .lg{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
  .lg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .lg b{color:var(--ink)}
  @media (max-width:860px){
    .side{display:none}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .topbar .brand{padding:0}
    .content{padding:18px 16px}
    .cols{grid-template-columns:1fr}
    .invoice,.statusdoc{padding:20px}
    .invoice .parties{grid-template-columns:1fr}
    .itotals{width:100%}
    .kv{grid-template-columns:130px 1fr}
    .mnav{display:flex;gap:4px}
    .mnav a{padding:7px 9px;border-radius:8px;color:var(--ink-2);font-weight:700;font-size:13px}
    .mnav a.active{background:var(--accent);color:var(--accent-ink)}
  }
  @media print{
    .side,.topbar,.actions,.noprint,#toast{display:none!important}
    html,body,.app,.main{height:auto!important;min-height:0!important}
    .content{padding:0;max-width:none;min-height:0!important}
    .card{box-shadow:none}
    .invoice,.statusdoc{border:none;box-shadow:none;padding:0;max-width:none}
  }
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16h5l-2-8h6l3 8M11 16l4-8"/><path d="M7.5 8h3"/></svg></span> <span class="brandname">Your shop</span></div>

<script>
"use strict";
/* ---------- constants ---------- */
const STAGES = ["Consult","Design","Tubing prep","Mitering","Tacking","Brazing","Alignment","Frame prep","Paint","Assembly","Packaging","Shipped","Delivered","Done"];
const DONE_STAGES = ["Delivered","Done"];
const OPEN_STAGES = STAGES.filter(s=>!DONE_STAGES.includes(s));
const STAGE_MIGRATION = {"Inquiry":"Consult","Fit":"Consult","Quote":"Design","Deposit":"Design","Queue":"Tubing prep","Fabrication":"Brazing","Parts":"Assembly","QC":"Frame prep","Ready":"Packaging","Closed":"Done","Finishing work":"Frame prep"};
const STATUS_MSG = {"Consult":"We're finalizing the details and plan for your build.","Design":"Your frame geometry is being designed.","Tubing prep":"Selecting and preparing the tubing for your frame.","Mitering":"Cutting and coping your tubes for a precise fit.","Tacking":"Tacking the frame together and checking fit.","Brazing":"Brazing the joints — your frame is taking shape.","Alignment":"Checking and aligning the frame.","Frame prep":"Prepping the frame for paint — cleanup and filing.","Paint":"Your frame is in paint and finishing.","Assembly":"Building up your bike with its components.","Packaging":"Packing your bike carefully for delivery.","Shipped":"Your bike is on its way to you!","Delivered":"Your bike has been delivered — enjoy the ride!","Done":"Your build is complete. Thank you!"};
const TYPES = ["Custom frame","Custom build","Repair / service","Warranty"];
const DISCIPLINES = ["Road","Gravel","All-road","Cyclocross","MTB XC","MTB Trail","Track","Touring","Commuter","Randonneur"];
const MATERIALS = ["Steel","Stainless steel","Titanium","Carbon","Aluminum","Mixed"];
const FIT_FIELDS = [
  ["height","Height"],["inseam","Inseam"],["torso","Torso"],["armLength","Arm length"],
  ["shoulderWidth","Shoulder width"],["thigh","Thigh"],["lowerLeg","Lower leg"],["footLength","Foot length"],
  ["sitBoneWidth","Sit-bone width"],["flexibility","Flexibility"],
  ["saddleHeight","Saddle height*"],["saddleSetback","Saddle setback*"],["barDrop","Bar drop*"],["barReach","Bar reach*"]
];
const GEO_FIELDS = [
  ["stack","Stack"],["reach","Reach"],["tt","Top tube (eff)"],["st","Seat tube"],
  ["htAngle","Head angle"],["staAngle","Seat angle"],["chainstay","Chainstay"],["wheelbase","Wheelbase"],
  ["standover","Standover"],["bbDrop","BB drop"],["forkRake","Fork rake"],["trail","Trail"]
];

/* ---------- tiny IndexedDB layer ---------- */
const DB_NAME="buildbook", DB_VER=2;
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains("customers")) db.createObjectStore("customers",{keyPath:"id"});
      if(!db.objectStoreNames.contains("orders")) db.createObjectStore("orders",{keyPath:"id"});
      if(!db.objectStoreNames.contains("assets")){
        const s=db.createObjectStore("assets",{keyPath:"id"});
        s.createIndex("orderId","orderId",{unique:false});
      }
      if(!db.objectStoreNames.contains("invoices")){
        const s=db.createObjectStore("invoices",{keyPath:"id"});
        s.createIndex("customerId","customerId",{unique:false});
      }
      if(!db.objectStoreNames.contains("settings")) db.createObjectStore("settings",{keyPath:"id"});
    };
    r.onsuccess=e=>{_db=e.target.result;_db.onversionchange=()=>{try{_db.close();}catch(_){}};res(_db)};
    r.onerror=e=>rej(e.target.error);
    r.onblocked=()=>rej(new Error("Database upgrade is blocked — this app is open in another browser tab."));
  });
}
function tx(store,mode){return _db.transaction(store,mode).objectStore(store);}
function pr(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}
const dbAll=s=>pr(tx(s,"readonly").getAll());
const dbGet=(s,id)=>pr(tx(s,"readonly").get(id));
const dbPut=(s,o)=>pr(tx(s,"readwrite").put(o));
const dbDel=(s,id)=>pr(tx(s,"readwrite").delete(id));
function dbByOrder(orderId){return pr(tx("assets","readonly").index("orderId").getAll(orderId));}
async function dbDelOrderAssets(orderId){const a=await dbByOrder(orderId);for(const x of a)await dbDel("assets",x.id);}
async function migrateStages(){const orders=await dbAll("orders");for(const o of orders){if(o.stage&&!STAGES.includes(o.stage)){o.stage=STAGE_MIGRATION[o.stage]||"Consult";await dbPut("orders",o);}}}

/* ---------- helpers ---------- */
const uid=()=> (crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.floor(Math.random()*1e6));
const now=()=>new Date().toISOString();
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function esc(v){return (v==null?"":String(v)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(n){const x=Number(n||0);return "$"+x.toLocaleString(undefined,{maximumFractionDigits:0});}
function parseDate(iso){if(!iso)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){const p=iso.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}const d=new Date(iso);return isNaN(d)?null:d;}
function fdate(iso){const d=parseDate(iso);return d?d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"—";}
function daysUntil(iso){const d=parseDate(iso);if(!d)return null;return Math.round((d.setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/864e5);}
function fields(obj){const o={};for(const [k,v] of new FormData(obj).entries())o[k]=typeof v==="string"?v.trim():v;return o;}
function stageChip(stage){const cls=DONE_STAGES.includes(stage)?"good":(stage==="Packaging"||stage==="Shipped"?"warn":"stage");return `<span class="chip ${cls}"><span class="dot"></span>${esc(stage)}</span>`;}
function bomTotal(o){return (Array.isArray(o.bom)?o.bom:[]).reduce((s,b)=>s+Number(b.price||0),0);}
function assetUrl(a){try{return a&&a.blob instanceof Blob?URL.createObjectURL(a.blob):"";}catch(_){return "";}}
function downscaleImg(src,max){return new Promise(res=>{if(!src)return res("");const img=new Image();img.onload=()=>{try{let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;if(!w||!h)return res(src);if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",0.82));}catch(_){res("");}};img.onerror=()=>res("");img.src=src;});}
function downscaleBlob(blob,max){return new Promise(res=>{if(!(blob instanceof Blob)||!(blob.type||"").startsWith("image/"))return res(blob);const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{try{let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;if(!w||!h){URL.revokeObjectURL(url);return res(blob);}if(w<=max&&h<=max&&blob.size<800000){URL.revokeObjectURL(url);return res(blob);}if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(url);res(b&&b.size<blob.size?b:blob);},"image/jpeg",0.85);}catch(_){URL.revokeObjectURL(url);res(blob);}};img.onerror=()=>{URL.revokeObjectURL(url);res(blob);};img.src=url;});}
async function migrateImages(){try{const assets=await dbAll("assets");for(const a of assets){if(a.blob instanceof Blob&&(a.type||"").startsWith("image/")&&a.blob.size>800000){const b=await downscaleBlob(a.blob,1600);if(b&&b.size<a.blob.size){a.blob=b;a.type="image/jpeg";await dbPut("assets",a);}}}const bp=await getBuilder();if(bp&&typeof bp.logo==="string"&&bp.logo.length>500000){const d=await downscaleImg(bp.logo,600);if(d&&d.length<bp.logo.length){bp.logo=d;await dbPut("settings",bp);renderShopInfo(bp);}}}catch(_){}}
async function printEl(sel,title){
  const el=document.querySelector(sel);if(!el){window.print();return;}
  const imgs=[...el.querySelectorAll("img")];
  const orig=imgs.map(im=>im.getAttribute("src"));
  // swap every image for a downscaled copy so the PDF stays small and valid, then restore
  await Promise.all(imgs.map((im,i)=>new Promise(r=>{downscaleImg(orig[i]||"",1100).then(d=>{if(d){im.onload=im.onerror=()=>r();im.setAttribute("src",d);}else r();}).catch(()=>r());})));
  const oldT=document.title;if(title)document.title=title;
  try{window.print();}catch(_){}
  setTimeout(()=>{document.title=oldT;imgs.forEach((im,i)=>{im.onload=im.onerror=null;if(orig[i]!=null)im.setAttribute("src",orig[i]);});},700);
}
/* ---------- tiny charts (no libraries) ---------- */
const PALETTE=["#e8590c","#1a9e8f","#3b82f6","#8b5cf6","#1a7f4b","#b7791f","#c0392b","#7a8699"];
function lastMonths(n){const out=[],now=new Date();for(let i=n-1;i>=0;i--){const x=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({key:`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`,label:x.toLocaleString(undefined,{month:"short"})});}return out;}
function tally(arr){const m={};arr.forEach(v=>{m[v]=(m[v]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));}
function svgBars(data,fmt){
  const w=520,h=200,pl=12,pr=12,pt=22,pb=26,iw=w-pl-pr,ih=h-pt-pb;
  const max=Math.max(1,...data.map(d=>d.value)),n=data.length||1,gap=iw/n,bw=Math.min(54,gap*0.62);
  let s=`<line x1="${pl}" y1="${pt+ih}" x2="${w-pr}" y2="${pt+ih}" stroke="var(--line)"/>`;
  data.forEach((d,i)=>{const bh=d.value/max*ih,x=pl+gap*i+(gap-bw)/2,y=pt+ih-bh;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="3" fill="var(--accent)"/>`;
    if(d.value)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-2)">${fmt?fmt(d.value):d.value}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(pt+ih+16).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-2)">${esc(d.label)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;max-width:100%">${s}</svg>`;
}
function hbars(data,fmt){const max=Math.max(1,...data.map(d=>d.value));return `<div class="hbars">${data.map(d=>`<div class="hbar"><div class="hbar-l" title="${esc(d.label)}">${esc(d.label)}</div><div class="hbar-track"><div class="hbar-fill" style="width:${d.value?Math.max(4,Math.round(d.value/max*100)):0}%"></div></div><div class="hbar-v">${fmt?fmt(d.value):d.value}</div></div>`).join("")}</div>`;}
function donut(data){
  const total=data.reduce((s,d)=>s+d.value,0)||1,R=42,C=2*Math.PI*R;let off=0,segs="";
  data.forEach((d,i)=>{const len=d.value/total*C;segs+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${PALETTE[i%PALETTE.length]}" stroke-width="15" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=len;});
  const legend=data.map((d,i)=>`<div class="lg"><span class="sw" style="background:${PALETTE[i%PALETTE.length]}"></span>${esc(d.label)} <b>${d.value}</b></div>`).join("");
  return `<div class="donut-wrap"><svg viewBox="0 0 120 120" width="118" height="118" style="flex:0 0 auto">${segs}<text x="60" y="57" text-anchor="middle" font-size="21" font-weight="800" fill="var(--ink)">${total}</text><text x="60" y="73" text-anchor="middle" font-size="9" fill="var(--ink-2)">total</text></svg><div class="donut-legend">${legend}</div></div>`;
}
function extUrl(v){if(!v)return null;v=String(v).trim();return /^https?:\/\//i.test(v)?v:null;}
function igUrl(v){if(!v)return null;v=String(v).trim();return /^https?:\/\//i.test(v)?v:"https://instagram.com/"+v.replace(/^@/,"");}
function webUrl(v){if(!v)return null;v=String(v).trim();if(/^https?:\/\//i.test(v))return v;return /^[\w-]+(\.[\w-]+)+/.test(v)?"https://"+v:null;}
function socialRow(l,val,url){return val?`<dt>${l}</dt><dd>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:650">${esc(val)}</a>`:esc(val)}</dd>`:"";}
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:650;z-index:99;box-shadow:var(--shadow)";document.body.appendChild(t);}t.textContent=msg;t.style.opacity="1";clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity="0",1600);}

/* ---------- router ---------- */
function parseHash(){
  const h=location.hash.replace(/^#/,"")||"/";
  const [path,q]=h.split("?");
  const parts=path.split("/").filter(Boolean); // ["orders","<id>","edit"]
  const query={};if(q)for(const kv of q.split("&")){const [k,v]=kv.split("=");query[k]=decodeURIComponent(v||"");}
  return {parts,query};
}
async function router(){
  const {parts,query}=parseHash();
  const [a,b,c]=parts;
  markNav(a||"dash");
  try{
    if(!a) return viewDashboard();
    if(a==="customers"){
      if(!b) return viewCustomers();
      if(b==="new") return viewCustomerForm(null);
      if(c==="edit") return viewCustomerForm(b);
      return viewCustomerDetail(b);
    }
    if(a==="orders"){
      if(!b) return viewBoard();
      if(b==="new") return viewOrderForm(null,query);
      if(c==="edit") return viewOrderForm(b,query);
      if(c==="status") return viewBuildStatus(b);
      return viewOrderDetail(b);
    }
    if(a==="invoices"){
      if(!b) return viewInvoices();
      if(b==="new") return viewInvoiceForm(null,query);
      if(c==="edit") return viewInvoiceForm(b,query);
      if(c==="deposit") return viewInvoiceDeposit(b);
      return viewInvoiceDetail(b);
    }
    if(a==="builder") return viewBuilderForm();
    if(a==="settings") return viewSettings();
    viewDashboard();
  }catch(err){ $("#app").innerHTML=`<div class="empty">Something went wrong: ${esc(err.message)}</div>`; console.error(err); }
}
function markNav(k){$$("#nav a,#mnav a").forEach(x=>x.classList.toggle("active",x.dataset.k===k||(k==="dash"&&x.dataset.k==="dash")));}
function show(html,init){const app=$("#app");app.innerHTML=html;window.scrollTo(0,0);if(init)init(app);}
function go(hash){location.hash=hash;}

function dashToggle(k){const det=document.getElementById("dashDetail");if(!det)return;if(dashCur===k){det.innerHTML="";dashCur="";}else{det.innerHTML=dashPanels[k]||"";dashCur=k;}document.querySelectorAll("#kpis .tile").forEach(t=>t.classList.toggle("active",t.dataset.k===dashCur));}
async function viewDashboard(){
  const [orders,customers,invoices]=await Promise.all([dbAll("orders"),dbAll("customers"),dbAll("invoices")]);
  const active=orders.filter(o=>!DONE_STAGES.includes(o.stage));
  const pipeline=active.reduce((s,o)=>s+bomTotal(o),0);
  const collected=invoices.reduce((s,i)=>s+invPaid(i),0);
  const paidInvs=invoices.filter(i=>i.status==="Paid").sort((a,b)=>(b.issueDate||b.createdAt||"").localeCompare(a.issueDate||a.createdAt||""));
  const earned=paidInvs.reduce((s,i)=>s+invTotal(i),0);
  const outstanding=invoices.filter(i=>i.status!=="Paid").reduce((s,i)=>s+Math.max(0,invBalance(i)),0);
  const overdue=active.filter(o=>{const d=daysUntil(o.promisedDate);return d!=null&&d<0;}).sort((a,b)=>(a.promisedDate||"").localeCompare(b.promisedDate||""));
  const avgVal=active.length?Math.round(pipeline/active.length):0;
  const cmap=Object.fromEntries(customers.map(c=>[c.id,c]));
  const soon=[...active].filter(o=>o.promisedDate).sort((a,b)=>(a.promisedDate||"").localeCompare(b.promisedDate||"")).slice(0,6);
  const months=lastMonths(6);
  const rev=months.map(m=>({label:m.label,value:0})), nb=months.map(m=>({label:m.label,value:0}));
  invoices.forEach(inv=>invPaymentList(inv).forEach(p=>{if(p.date){const i=months.findIndex(m=>m.key===String(p.date).slice(0,7));if(i>=0)rev[i].value+=Number(p.amount||0);}}));
  orders.forEach(o=>{if(o.createdAt){const i=months.findIndex(m=>m.key===String(o.createdAt).slice(0,7));if(i>=0)nb[i].value++;}});
  const byStageCount=OPEN_STAGES.map(s=>({label:s,value:active.filter(o=>o.stage===s).length})).filter(x=>x.value>0);
  const byStageValue=OPEN_STAGES.map(s=>({label:s,value:active.filter(o=>o.stage===s).reduce((x,o)=>x+bomTotal(o),0)})).filter(x=>x.value>0);
  const buildVals=active.map(o=>({label:o.title||"Untitled",value:bomTotal(o)})).sort((a,b)=>b.value-a.value);
  const unpaid=invoices.filter(i=>i.status!=="Paid"&&invBalance(i)>0).sort((a,b)=>invBalance(b)-invBalance(a));
  const noData='<div class="muted">No data yet.</div>';
  const card=(t,body)=>`<div class="card"><div class="hd">${t}</div><div class="bd">${body}</div></div>`;
  dashPanels={
    active:card("Active builds",`<h2 style="margin:0 0 8px;font-size:14px">Pipeline by stage</h2>${byStageCount.length?hbars(byStageCount):noData}<h2 style="margin:22px 0 6px;font-size:14px">New builds · last 6 months</h2>${orders.length?svgBars(nb):noData}`),
    pipeline:card("Pipeline value by stage",byStageValue.length?hbars(byStageValue,money):noData),
    avg:card("Active build values",buildVals.length?`<p class="muted" style="margin:0 0 12px">Average ${money(avgVal)} across ${active.length} active build${active.length===1?"":"s"}.</p>`+hbars(buildVals,money):noData),
    collected:card("Revenue collected · last 6 months",collected?svgBars(rev,money):noData),
    earned:card("Paid invoices · money earned",paidInvs.length?`<p class="muted" style="margin:0 0 12px">${money(earned)} earned across ${paidInvs.length} paid invoice${paidInvs.length===1?"":"s"}.</p><table><thead><tr><th>#</th><th>Customer</th><th>Issued</th><th style="text-align:right">Total</th></tr></thead><tbody>${paidInvs.map(i=>`<tr onclick="go('#/invoices/${i.id}')"><td><b>${esc(i.number||"—")}</b></td><td class="muted">${esc(cmap[i.customerId]?.name||"—")}</td><td class="muted">${fdate(i.issueDate)}</td><td style="text-align:right;font-weight:700">${money(invTotal(i))}</td></tr>`).join("")}</tbody></table>`:'<div class="muted">No paid invoices yet.</div>'),
    outstanding:card("Unpaid invoices",unpaid.length?`<table><thead><tr><th>#</th><th>Customer</th><th style="text-align:right">Balance</th></tr></thead><tbody>${unpaid.map(i=>`<tr onclick="go('#/invoices/${i.id}')"><td><b>${esc(i.number||"—")}</b></td><td class="muted">${esc(cmap[i.customerId]?.name||"—")}</td><td style="text-align:right;font-weight:700">${money(invBalance(i))}</td></tr>`).join("")}</tbody></table>`:'<div class="muted">Nothing outstanding.</div>'),
    overdue:card("Overdue builds",overdue.length?`<table><thead><tr><th>Build</th><th>Customer</th><th>Promised</th></tr></thead><tbody>${overdue.map(o=>{const d=daysUntil(o.promisedDate);return `<tr onclick="go('#/orders/${o.id}')"><td><b>${esc(o.title||"Untitled")}</b></td><td class="muted">${esc(cmap[o.customerId]?.name||"—")}</td><td style="color:var(--bad);font-weight:700">${fdate(o.promisedDate)} (${Math.abs(d)}d late)</td></tr>`;}).join("")}</tbody></table>`:'<div class="muted">Nothing overdue.</div>')
  };
  dashCur="";
  const tile=(k,label,val,style)=>`<div class="tile click" data-k="${k}" onclick="dashToggle('${k}')"><div class="k">${label} <span class="car">▾</span></div><div class="v"${style?` style="${style}"`:""}>${val}</div></div>`;

        </tbody></table>`:`<div class="empty">No active builds.</div>`}
      </div></div>
      <div class="card"><div class="hd">Upcoming deliveries</div><div class="bd tight">
        ${soon.length?`<table><thead><tr><th>Build</th><th>Customer</th><th>Stage</th><th>Promised</th></tr></thead><tbody>
        ${soon.map(o=>{const d=daysUntil(o.promisedDate);const late=d!=null&&d<0;return `<tr onclick="go('#/orders/${o.id}')"><td><b>${esc(o.title||"Untitled")}</b></td><td class="muted">${esc(cmap[o.customerId]?.name||"—")}</td><td>${stageChip(o.stage)}</td><td style="${late?'color:var(--bad);font-weight:700':''}">${fdate(o.promisedDate)}${late?` (${Math.abs(d)}d late)`:d!=null?` (${d}d)`:''}</td></tr>`;}).join("")}

      </div></div>
    </div>
    <p class="sub" style="margin-top:14px">${customers.length} customer${customers.length===1?"":"s"} · ${orders.length} total build${orders.length===1?"":"s"} · ${invoices.length} invoice${invoices.length===1?"":"s"}</p>
  `);
}

let boardSort="newest";
function sortBuilds(list){const arr=list.slice();const s=boardSort;
  if(s==="oldest")arr.sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  else if(s==="promised")arr.sort((a,b)=>(a.promisedDate||"9999-99-99").localeCompare(b.promisedDate||"9999-99-99"));
  else if(s==="name")arr.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  else if(s==="value")arr.sort((a,b)=>bomTotal(b)-bomTotal(a));
  else arr.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  return arr;}

/* ---------- BikeCAD geometry import ---------- */
function parseGeometry(text){
  const out={};if(!text)return out;
  const pats=[
    ["stack",/\bstack\b/i],
    ["reach",/\breach\b/i],
    ["tt",/top\s*tube|effective\s*tt|\bett\b/i],
    ["staAngle",/seat\s*(tube\s*)?angle/i],
    ["htAngle",/head\s*(tube\s*)?angle/i],
    ["st",/seat\s*tube(?!\s*angle)/i],
    ["chainstay",/chain\s*stay/i],
    ["wheelbase",/wheel\s*base/i],
    ["standover",/stand\s*over/i],
    ["bbDrop",/(bottom\s*bracket|\bbb)\s*drop/i],
    ["forkRake",/fork\s*(rake|offset)|\brake\b/i],
    ["trail",/\btrail\b/i]
  ];
  const num=/-?\d+(?:\.\d+)?/;
  for(const raw of String(text).split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    const m=line.match(num);if(!m)continue;
    for(const [field,re] of pats){ if(out[field]!=null)continue; if(re.test(line)){out[field]=m[0];break;} }
  }
  return out;
}
function extractGeoToForm(){
  const ta=document.getElementById("geoPaste");if(!ta)return;
  const g=parseGeometry(ta.value);const keys=Object.keys(g);
  if(!keys.length){toast("No geometry values recognized — check what you pasted");return;}
  for(const k of keys){const inp=document.querySelector('[name="geo_'+k+'"]');if(inp)inp.value=g[k];}
  toast("Filled "+keys.length+" geometry field"+(keys.length>1?"s":""));
}

async function advance(id){
  const o=await dbGet("orders",id);const i=STAGES.indexOf(o.stage);
  if(i<0||i>=STAGES.length-1)return;
  o.stage=STAGES[i+1];o.stageLog=o.stageLog||[];o.stageLog.push({ts:now(),stage:o.stage,note:"Advanced"});
  if(DONE_STAGES.includes(o.stage))o.blocker="";
  o.updatedAt=now();await dbPut("orders",o);toast("Moved to "+o.stage);router();
}

async function exportData(){
  const [customers,orders,assets,invoices,settings]=await Promise.all([dbAll("customers"),dbAll("orders"),dbAll("assets"),dbAll("invoices"),dbAll("settings")]);
  const encAssets=[];
  for(const a of assets){const b64=await blobToB64(a.blob);encAssets.push({...a,blob:null,b64,mime:a.type});}
  const dump={_app:"buildbook",_v:2,exportedAt:now(),customers,orders,invoices,settings,assets:encAssets};
  const blob=new Blob([JSON.stringify(dump)],{type:"application/json"});
  const bp=settings.find(s=>s.id==="builder")||{};
  const slug=((bp.shopName||bp.builderName||"shop").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""))||"shop";
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=slug+"-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
  toast("Backup downloaded");
}
async function importData(input){
  const file=input.files[0];if(!file)return;
  if(!confirm("Importing will REPLACE all current data with the backup. Continue?"))return;
  const text=await file.text();const dump=JSON.parse(text);
  if(dump._app!=="buildbook")return alert("This isn't a valid backup file.");
  for(const s of ["customers","orders","assets","invoices","settings"]){const store=tx(s,"readwrite");await pr(store.clear());}
  for(const c of dump.customers||[])await dbPut("customers",c);
  for(const o of dump.orders||[])await dbPut("orders",o);
  for(const iv of dump.invoices||[])await dbPut("invoices",iv);
  for(const st of dump.settings||[])await dbPut("settings",st);
  for(const a of dump.assets||[]){const blob=a.b64?b64ToBlob(a.b64,a.mime):null;await dbPut("assets",{id:a.id,orderId:a.orderId,kind:a.kind,name:a.name,type:a.mime||a.type,createdAt:a.createdAt,blob});}
  renderShopInfo(await getBuilder());
  toast("Backup imported");go("#/");
}
function blobToB64(blob){return new Promise(res=>{if(!(blob instanceof Blob))return res(null);const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>res(null);try{r.readAsDataURL(blob);}catch(_){res(null);}});}
function b64ToBlob(b64,mime){const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime||"application/octet-stream"});}

/* ---------- Invoices ---------- */
function invSubtotal(inv){return (inv.items||[]).reduce((s,i)=>s+Number(i.qty||0)*Number(i.unitPrice||0),0);}
function invDiscount(inv){const sub=invSubtotal(inv),v=Number(inv.discountValue||0);if(!v)return 0;const amt=(inv.discountType==="%")?sub*v/100:v;return Math.max(0,Math.min(sub,amt));}
function invTax(inv){return (invSubtotal(inv)-invDiscount(inv))*Number(inv.taxRate||0)/100;}
function invTotal(inv){return invSubtotal(inv)-invDiscount(inv)+invTax(inv);}
function invPaymentList(inv){
  if(Array.isArray(inv.payments))return inv.payments;
  const out=[]; // legacy invoices stored single deposit/payment amounts
  if(Number(inv.depositApplied||0))out.push({amount:inv.depositApplied,note:"Deposit",date:inv.depositDate||""});
  if(Number(inv.amountPaid||0))out.push({amount:inv.amountPaid,note:"Payment",date:""});
  return out;
}
function invPaid(inv){return invPaymentList(inv).reduce((s,p)=>s+Number(p.amount||0),0);}

/* ---------- PDF export (self-contained, no libraries) ---------- */
function toAscii(s){return String(s==null?"":s).replace(/[—–]/g,"-").replace(/·/g,"-").replace(/°/g," deg").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/✓/g,"x").replace(/→/g,"->").replace(/[^\x20-\x7E]/g," ");}
function pdfMoney(v){return "$"+Number(v||0).toLocaleString("en-US",{maximumFractionDigits:0});}
function logoImage(dataUrl,maxW,maxH){return new Promise(res=>{if(!dataUrl)return res(null);const img=new Image();img.onload=()=>{try{let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;if(!w||!h)return res(null);const scale=Math.min(maxW/w,maxH/h,1);const dw=Math.max(1,Math.round(w*scale)),dh=Math.max(1,Math.round(h*scale));const c=document.createElement("canvas");c.width=Math.max(1,Math.min(w,dw*2));c.height=Math.max(1,Math.min(h,dh*2));const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const b64=c.toDataURL("image/jpeg",0.9).split(",")[1];const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);res({bytes,w:c.width,h:c.height,dw,dh});}catch(_){res(null);}};img.onerror=()=>res(null);img.src=dataUrl;});}
function Pdf(){
  const W=612,H=792,M=54,RIGHT=W-M,BOTTOM=54;
  const pages=[];let ops=[];let y=H-M;
  const esc=s=>toAscii(s).replace(/([\\()])/g,"\\$1");
  const wid=(s,sz,b)=>toAscii(s).length*sz*(b?0.55:0.5);
  const emit=(s,x,sz,b,col)=>{ops.push((col?col+" rg ":"")+`BT /F${b?2:1} ${sz} Tf 1 0 0 1 ${(+x).toFixed(2)} ${y.toFixed(2)} Tm (${esc(s)}) Tj ET`+(col?" 0 0 0 rg":""));};
  const need=h=>{if(y-h<BOTTOM){pages.push(ops.join("\n"));ops=[];y=H-M;}};
  return {
    W,H,M,RIGHT,get y(){return y;},
    image(lg){if(!lg)return;need(lg.dh+6);const yb=y-lg.dh;ops.push(`q ${lg.dw} 0 0 ${lg.dh} ${M} ${yb.toFixed(2)} cm /Im0 Do Q`);y-=(lg.dh+26);},
    text(s,o){o=o||{};const sz=o.size||10;need(sz+2);emit(s,o.x==null?M:o.x,sz,!!o.bold,o.color||null);y-=(o.gap==null?sz+5:o.gap);},
    lr(l,r,o){o=o||{};const sz=o.size||10;need(sz+2);emit(l,M,sz,!!o.bold);emit(r,RIGHT-wid(r,sz,o.bold),sz,!!o.bold);y-=(sz+5);},
    cols(cells){need(13);for(const c of cells){const sz=c.size||10;emit(c.t,c.right?(c.x-wid(c.t,sz,c.bold)):c.x,sz,!!c.bold);}y-=15;},
    total(label,val,bold){need(14);const sz=bold?11:10;emit(label,470-wid(label,sz,bold),sz,!!bold);emit(val,RIGHT-wid(val,sz,bold),sz,!!bold);y-=(sz+5);},
    gap(h){y-=(h==null?8:h);},
    hr(){need(4);ops.push(`0.82 0.82 0.82 RG 0.7 w ${M} ${(y+7).toFixed(2)} m ${RIGHT} ${(y+7).toFixed(2)} l S 0 0 0 RG`);y-=8;},
    build(lg){if(ops.length)pages.push(ops.join("\n"));return pdfAssemble(pages,W,H,lg);}
  };
}
function pdfAssemble(streams,W,H,image){
  if(!streams.length)streams=[""];
  const enc=new TextEncoder();
  const objs=[];
  objs[1]="<</Type/Catalog/Pages 2 0 R>>";
  objs[3]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>";
  objs[4]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>";
  let n=5,imgN=0;
  if(image){imgN=n++;}
  const resX=image?`/XObject<</Im0 ${imgN} 0 R>>`:"";
  const kids=[];
  for(const s of streams){const pnum=n++,cnum=n++;kids.push(pnum);objs[pnum]=`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>${resX}>>/Contents ${cnum} 0 R>>`;objs[cnum]={stream:s};}
  objs[2]=`<</Type/Pages/Kids[${kids.map(k=>k+" 0 R").join(" ")}]/Count ${kids.length}>>`;
  if(image)objs[imgN]={image};
  const parts=[];let pos=0;const off=[];
  const add=x=>{const b=(typeof x==="string")?enc.encode(x):x;parts.push(b);pos+=b.length;};
  add("%PDF-1.4\n");
  for(let i=1;i<n;i++){off[i]=pos;add(`${i} 0 obj\n`);const o=objs[i];
    if(typeof o==="string")add(o);
    else if(o.stream!=null){const sb=enc.encode(o.stream);add(`<</Length ${sb.length}>>\nstream\n`);add(sb);add("\nendstream");}
    else if(o.image){const im=o.image;add(`<</Type/XObject/Subtype/Image/Width ${im.w}/Height ${im.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${im.bytes.length}>>\nstream\n`);add(im.bytes);add("\nendstream");}
    add("\nendobj\n");}
  const xref=pos;add(`xref\n0 ${n}\n0000000000 65535 f \n`);
  for(let i=1;i<n;i++)add(String(off[i]).padStart(10,"0")+" 00000 n \n");
  add(`trailer\n<</Size ${n}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`);
  const total=new Uint8Array(pos);let p=0;for(const b of parts){total.set(b,p);p+=b.length;}
  return new Blob([total],{type:"application/pdf"});
}
function savePdf(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name||"document.pdf";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast("PDF downloaded");}
async function invoicePdf(inv,c,b,opts){
  opts=opts||{};const p=Pdf();const items=inv.items||[];
  const sub=invSubtotal(inv),tax=invTax(inv),tot=invTotal(inv),paid=invPaid(inv);
  const logo=await logoImage(b.logo,180,64);if(logo)p.image(logo);
  p.text(opts.deposit?"DEPOSIT INVOICE":"INVOICE",{size:22,bold:true,gap:26});

  p.text(b.shopName||b.builderName||"Your shop",{size:13,bold:true});
  if(b.shopName&&b.builderName)p.text(b.builderName,{size:10,color:"0.45 0.45 0.45"});
  if(b.address)String(b.address).split(/\r?\n/).forEach(l=>l&&p.text(l,{size:10,color:"0.45 0.45 0.45"}));
  [b.email,b.phone,b.website,b.taxId?("Tax ID: "+b.taxId):""].filter(Boolean).forEach(l=>p.text(l,{size:10,color:"0.45 0.45 0.45"}));
  p.gap(6);p.hr();
  p.text("BILL TO",{size:8,bold:true,color:"0.45 0.45 0.45",gap:12});
  p.text((c&&c.name)||"-",{size:11,bold:true});
  if(c&&c.address)String(c.address).split(/\r?\n/).forEach(l=>l&&p.text(l,{size:10,color:"0.45 0.45 0.45"}));
  [c&&c.email,c&&c.phone].filter(Boolean).forEach(l=>p.text(l,{size:10,color:"0.45 0.45 0.45"}));
  p.gap(2);p.text("Issued: "+fdate(inv.issueDate)+(inv.dueDate?"     Due: "+fdate(inv.dueDate):""),{size:10,color:"0.45 0.45 0.45"});
  p.gap(6);p.hr();
  p.cols([{t:"DESCRIPTION",x:p.M,bold:true,size:9},{t:"QTY",x:404,right:true,bold:true,size:9},{t:"UNIT",x:478,right:true,bold:true,size:9},{t:"AMOUNT",x:p.RIGHT,right:true,bold:true,size:9}]);
  p.hr();
  if(items.length)items.forEach(it=>{const amt=Number(it.qty||0)*Number(it.unitPrice||0);let d=toAscii(it.description||"");if(d.length>60)d=d.slice(0,58)+"..";p.cols([{t:d,x:p.M},{t:String(it.qty||1),x:404,right:true},{t:pdfMoney(it.unitPrice),x:478,right:true},{t:pdfMoney(amt),x:p.RIGHT,right:true}]);});
  else p.text("No line items.",{size:10,color:"0.45 0.45 0.45"});
  p.gap(4);p.hr();
  p.total("Subtotal",pdfMoney(sub));
  if(invDiscount(inv))p.total("Discount"+(inv.discountType==="%"?" ("+inv.discountValue+"%)":""),"-"+pdfMoney(invDiscount(inv)));
  if(Number(inv.taxRate||0))p.total("Tax ("+inv.taxRate+"%)",pdfMoney(tax));
  p.total("Total",pdfMoney(tot),true);
  if(opts.deposit){const pct=opts.pct||0;const depAmt=Math.round(tot*pct/100);const depDue=Math.max(0,depAmt-paid);const rem=Math.max(0,tot-depAmt);if(paid)p.total("Already paid","-"+pdfMoney(paid));p.total("Deposit due now ("+pct+"%)",pdfMoney(depDue),true);p.total("Remaining balance",pdfMoney(rem));}
  else{invPaymentList(inv).filter(x=>Number(x.amount||0)).forEach(x=>p.total((x.note||"Payment")+(x.date?" ("+fdate(x.date)+")":""),"-"+pdfMoney(x.amount)));p.total("Balance due",pdfMoney(Math.max(0,invBalance(inv))),true);}
  if(inv.notes){p.gap(10);p.hr();p.text("NOTES",{size:8,bold:true,color:"0.45 0.45 0.45",gap:12});String(inv.notes).split(/\r?\n/).forEach(l=>p.text(l,{size:10}));}
  return p.build(logo);
}
async function statusPdf(o,c,b){

  const logo=await logoImage(b.logo,180,64);if(logo)p.image(logo);
  p.text(b.shopName||b.builderName||"Your shop",{size:14,bold:true,gap:17});

  p.text(o.title||"Your custom build",{size:14,bold:true});
  [["Material",o.frameMaterial],["Tubing",o.tubing],["Groupset",o.groupset],["Wheels",o.wheels],["Finish",o.finish]].filter(x=>x[1]).forEach(x=>p.text(x[0]+": "+x[1],{size:10,color:"0.45 0.45 0.45"}));

  if(bom.length)bom.forEach(bi=>p.cols([{t:toAscii(bi.category||""),x:p.M,size:9},{t:toAscii((bi.item||"")+(bi.brand?" ("+bi.brand+")":"")).slice(0,42),x:160,size:9},{t:toAscii(bi.status||""),x:400,right:true,size:9},{t:bi.price?pdfMoney(bi.price):"-",x:p.RIGHT,right:true,size:9}]));
